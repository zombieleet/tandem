# make check on Linux and macOS, on the oldest Emacs the package supports
# and the current one, and the daemon's tests on Windows, over TCP as it
# runs there. The tests never call a model: they use the fake claude in
# daemon/internal/testutil/fakeclaude.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        emacs: ["29.1", "30.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      # make check-manual needs makeinfo, which the macOS runner lacks.
      - if: runner.os == 'macOS'
        run: |
          brew install texinfo
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
      - run: make check

  daemon-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - run: go vet ./...
      - run: go test -count=1 ./...
        env:
          CPD_TEST_TCP: "1"
